<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#b8863f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bgFade)"/>

  <!-- Faint corner brush strokes for texture, no real imagery -->
  <path d="M0 0 L220 0 L60 180 L0 140 Z" fill="#d4af6a" opacity="0.06"/>
  <path d="M1600 0 L1380 0 L1540 180 L1600 140 Z" fill="#d4af6a" opacity="0.06"/>
  <path d="M0 600 L200 600 L40 430 L0 460 Z" fill="#d4af6a" opacity="0.05"/>
  <path d="M1600 600 L1400 600 L1560 430 L1600 460 Z" fill="#d4af6a" opacity="0.05"/>

  <!-- Left generic shirt silhouette (no real name, fictional number) -->
  <g transform="translate(120,150)" opacity="0.9">
    <path d="M40 20 L90 0 L120 40 L100 70 L90 55 L90 260 L10 260 L10 55 L0 70 L-20 40 L10 0 Z" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="50" y="170" fill="#d4af6a" font-size="70" font-weight="700" text-anchor="middle">7</text>
  </g>

  <!-- Right generic shirt silhouette (no real name, fictional number) -->
  <g transform="translate(1340,150)" opacity="0.9">
    <path d="M40 20 L90 0 L120 40 L100 70 L90 55 L90 260 L10 260 L10 55 L0 70 L-20 40 L10 0 Z" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="50" y="170" fill="#d4af6a" font-size="70" font-weight="700" text-anchor="middle">10</text>
  </g>

  <!-- KV mark -->
  <g transform="translate(800,90)" text-anchor="middle">
    <rect x="-34" y="-30" width="14" height="14" fill="none" stroke="#d4af6a" stroke-width="2"/>
    <rect x="20" y="-30" width="14" height="14" fill="none" stroke="#d4af6a" stroke-width="2" transform="translate(0,0)"/>
    <text y="16" font-size="46" font-weight="700" fill="url(#goldGrad)">KV</text>
  </g>

  <!-- Wordmark -->
  <text x="800" y="260" text-anchor="middle" font-size="120" font-weight="800" letter-spacing="2">
    <tspan fill="#f4f2ec">KIT</tspan><tspan fill="url(#goldGrad)">VLT</tspan>
  </text>

  <!-- Tagline -->
  <text x="800" y="310" text-anchor="middle" font-size="24" letter-spacing="6" fill="#f4f2ec">
    YOUR KIT. YOUR STYLE. <tspan fill="#d4af6a">YOUR VAULT.</tspan>
  </text>

  <!-- Trust badges row (honest claims, no 'authentic') -->
  <g font-size="19" fill="#e7e3d8" letter-spacing="1">
    <g transform="translate(490,380)">
      <circle cx="-24" cy="-6" r="12" fill="none" stroke="#d4af6a" stroke-width="2"/>
      <path d="M-30 -6 L-26 -2 L-18 -10" stroke="#d4af6a" stroke-width="2" fill="none"/>
      <text x="0" y="0">PREMIUM REPLICA KITS</text>
    </g>
    <line x1="800" y1="-18" x2="800" y2="8" stroke="#3a3a3a" stroke-width="1" transform="translate(0,380)"/>
    <g transform="translate(870,380)">
      <path d="M-24 -18 L-14 -14 L-14 -2 C-14 8 -24 12 -24 12 C-24 12 -34 8 -34 -2 L-34 -14 Z" fill="none" stroke="#d4af6a" stroke-width="2"/>
      <text x="-4" y="0">TOP QUALITY</text>
    </g>
    <line x1="1130" y1="-18" x2="1130" y2="8" stroke="#3a3a3a" stroke-width="1" transform="translate(0,380)"/>
    <g transform="translate(1180,380)">
      <circle cx="-24" cy="-6" r="13" fill="none" stroke="#d4af6a" stroke-width="2"/>
      <ellipse cx="-24" cy="-6" rx="6" ry="13" fill="none" stroke="#d4af6a" stroke-width="1.4"/>
      <line x1="-37" y1="-6" x2="-11" y2="-6" stroke="#d4af6a" stroke-width="1.4"/>
      <text x="0" y="0">WORLDWIDE SHIPPING</text>
    </g>
  </g>
</svg>
